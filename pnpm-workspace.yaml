shellEmulator: true
shamefullyHoist: true
disallowWorkspaceCycles: true
ignoreWorkspaceRootCheck: true

packages:
  - apps/*
  - packages/*
  - '!packages/nuxt-seo-sitemap/'

allowBuilds:
  sharp: false
  workerd: false
  esbuild: false
  vue-demi: false
  unrs-resolver: false
  '@parcel/watcher': false

updateConfig:
  ignoreDependencies:
    - typescript

catalog:
  nuxt: 'npm:nuxt-nightly@5.0.0-29775838.79ef035f'
  '@nuxt/module-builder': ^1.0.3
  '@nuxt/kit': 'npm:@nuxt/kit-nightly@5.0.0-29775838.79ef035f'

minimumReleaseAgeExclude:
  - '@fontsource-variable/jetbrains-mono@5.3.0'
