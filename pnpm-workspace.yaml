shellEmulator: true
shamefullyHoist: true
disallowWorkspaceCycles: true
ignoreWorkspaceRootCheck: true

packages:
  - apps/*
  - packages/*

allowBuilds:
  sharp: false
  workerd: false
  esbuild: false
  vue-demi: false
  unrs-resolver: false
  '@parcel/watcher': false

updateConfig:
  ignoreDependencies:
    - typescript

catalog:
  nuxt: 'npm:nuxt-nightly@5.0.0-29779718.52c9af0c'
  '@nuxt/module-builder': ^1.0.3
  '@nuxt/kit': 'npm:@nuxt/kit-nightly@5.0.0-29779718.52c9af0c'
